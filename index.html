<!DOCTYPE html>
<html>
<head>
<title>About Me</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img class="avatar" src="photo.jpg" alt="Profile picture of Khadija">
    <h1>Hi, I'm Khadija</h1>
    <p id="subtitle"></p>
    <p>Frontend Developer &amp; IT Instructor</p>
  </header>

  <nav>
    <a href="#about">About</a>
    <a href="#hobbies">Hobbies</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <div class="card-row">
      <section class="card" id="about">
        <h2>About Me</h2>
        <p>I'm learning web development because I want to build things for the internet.</p>
      </section>

      <section class="card" id="hobbies">
        <h2>Things I Enjoy</h2>
        <ul class="hobbies-list">
          <li>Reading</li>
          <li>Music</li>
          <li>singing</li>
          <li>eating</li>
          <li>sleeping</li>
          <li>Coding (soon!)</li>
        </ul>
      </section>
    </div>

    <section class="card" id="contact">
      <h2>Get In Touch</h2>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Say hello..."></textarea>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Khadija</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
